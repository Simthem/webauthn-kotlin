/*
 * Development harness only. This is a fake relying party used to exercise the credential
 * provider end to end on a device: it asks Credential Manager for a passkey exactly as a
 * real app would, which is the only way to prove that PQ Vault is actually offered in the
 * system picker. It is not part of the product and should not be shipped.
 */
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace = "com.pqvault.rptest"
    compileSdk = androidCompileSdk as int

    defaultConfig {
        applicationId = "com.pqvault.rptest"
        // 34 on purpose, unlike the app: the Credential Manager provider API this harness
        // exercises does not exist below Android 14.
        minSdk = 34
        targetSdk = androidTargetSdk as int
        versionCode = 1
        versionName = "1.0"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(jvmTargetIntermediate)
        targetCompatibility = JavaVersion.toVersion(jvmTargetIntermediate)
    }

    // Same reports the app module produces, so the CI job can publish or archive findings
    // from this module instead of only the ones app's checkDependencies happens to reach.
    lint {
        sarifReport = true
        htmlReport = true
        xmlReport = true
        abortOnError = true
    }
}

kotlin {
    jvmToolchain(jvmTargetHost as int)
    compilerOptions {
        jvmTarget = JvmTarget.fromTarget(jvmTargetIntermediate)
    }
}

dependencies {
    implementation "androidx.core:core-ktx:$coreVersion"
    implementation "androidx.appcompat:appcompat:$appcompatVersion"
    implementation "androidx.credentials:credentials:$credentialsVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
}
