buildscript {
    ext.kotlin_version = "$project.kotlinVersion"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10"
        classpath "de.mannodermaus.gradle.plugins:android-junit5:1.9.3.0"
    }
}

group = "com.pqvault"

/*
 * One command for everything a change has to pass before it is pushed, matching exactly
 * what CI runs. Without it the two drift, and the first place you find out is a red
 * pipeline on a branch you thought was finished.
 */
tasks.register("verify") {
    group = "verification"
    description = "Runs every unit test and Android Lint, as CI does"
    dependsOn ":vault:test", ":app:testDebugUnitTest", ":app:lintDebug"
}

tasks.register("testAll") {
    group = "verification"
    description = "Runs the unit tests of both modules"
    dependsOn ":vault:test", ":app:testDebugUnitTest"
}
