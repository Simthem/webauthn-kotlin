#
# PQ Vault - project-wide Gradle configuration
#
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Every value below is read by a build script. A version declared here and not used,
# or used with a different value written elsewhere, is worse than no declaration at
# all: it tells the reader and the dependency scanners something that is not true.
#

###############################################################################
# Build Performance & Memory Settings
###############################################################################

# JVM arguments optimized for production build environment
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx2g"

# Enable advanced Gradle features for better performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true


# Java toolchain resolution. The build asks for JDK 21 (jvmTargetHost below) and Gradle
# looks for it among the JDKs installed on the machine, so a JAVA_HOME pointing at an
# older JDK, or at a JRE without javac, no longer decides what compiles the project.
# Nothing is downloaded: no toolchain repository is configured, and a JDK fetched at
# build time is one more thing that would have to be trusted.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.fromEnv=JAVA_HOME,JDK_HOME

###############################################################################
# Android Configuration
###############################################################################

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=false

# R8 optimization settings
android.enableR8.fullMode=false

# Resource optimization
android.nonTransitiveRClass=true
android.nonFinalResIds=false
android.uniquePackageNames=true

# Default build features
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.databinding=false
android.defaults.buildfeatures.viewbinding=false


###############################################################################
# Code Style & Quality
###############################################################################

# Kotlin code style
kotlin.code.style=official

# KSP configuration
ksp.useKSP2=false
###############################################################################
# Toolchain Versions
###############################################################################

# Kotlin ecosystem
kotlinVersion=2.2.10
kspVersion=2.2.10-2.0.2
kotlinxCoroutinesVersion=1.10.2
kotlinxSerializationVersion=1.8.1

# Android Gradle Plugin
androidGradlePluginVersion=8.12.1

# JVM targets. jvmTargetHost is the JDK that runs the compilers and the tests,
# jvmTargetIntermediate the bytecode level written into the APK. They are separate on
# purpose: building on JDK 21 does not require emitting Java 21 bytecode, and D8 gains
# nothing from it.
jvmTargetHost=21
jvmTargetIntermediate=11

###############################################################################
# Android SDK Versions
###############################################################################

# Prefixed on purpose. Inside android { } a bare `compileSdk` or `minSdk` names the DSL
# property itself, so a project property with that name can never be read there.
# minSdk 30 keeps the app installable on older /e/OS builds. The rptest harness keeps
# its own 34, and the upstream webauthn module its own 35.
androidCompileSdk=36
androidTargetSdk=36
androidMinSdk=30

###############################################################################
# Dependency Versions
###############################################################################

# AndroidX Core Libraries
coreVersion=1.13.1
appcompatVersion=1.7.0
activityVersion=1.9.3
lifecycleVersion=2.8.7

# AndroidX Testing
espressoVersion=3.6.1
fragmentTestingVersion=1.8.5

# Room Database
roomVersion=2.6.1

# Biometric
biometricVersion=1.1.0

# Testing Libraries
mockkVersion=1.13.14
junit5Version=5.11.3
kotlinTestJunitVersion=2.2.10

# Assertion Libraries
truthVersion=1.4.4

# CBOR Processing
cborVersion=0.9

# Code Quality Tools
ktlintVersion=1.5.0

# Gradle Plugins
junit5AndroidPluginVersion=1.9.3.0
ktlintGradleVersion=13.1.0

###############################################################################
# Build Optimization Settings
###############################################################################

# Kotlin compilation optimization
kotlin.incremental=true
kotlin.build.report.output=file

# Android build optimization (Gradle build cache supersedes Android build cache)

###############################################################################
# Security & Compliance
###############################################################################

# Ensure reproducible builds
org.gradle.caching.debug=false
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

bouncyCastleVersion=1.86
# Security floors for transitive build/test tooling. AGP's Unified Test Platform and
# ktlint bring these libraries even though the application does not ship them.
nettyVersion=4.1.138.Final
protobufVersion=3.25.5
logbackVersion=1.6.5
guavaVersion=33.7.2-jre
credentialsVersion=1.5.0
okhttpVersion=4.12.0
composeBomVersion=2024.09.03
workVersion=2.9.1
zxingVersion=3.5.3
orgJsonVersion=20250107
cameraxVersion=1.3.4
