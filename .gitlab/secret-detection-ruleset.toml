[secrets]
  description = "Retain all bundled GitLab secret detection rules"
  validate = true

  [[secrets.passthrough]]
    type = "raw"
    target = "gitleaks.toml"
    value = """
    [extend]
      # GitLab's packaged ruleset, not the generic Gitleaks defaults.
      path = "/gitleaks.toml"
    """
