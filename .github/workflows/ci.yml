name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependency advisories land continuously, so the security jobs also run on a
    # schedule: a build that passed in March tells you nothing about today's CVEs.
    - cron: '17 4 * * 1'

# The default token is read-only; each job asks for exactly what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false

jobs:
  # Verifies gradle-wrapper.jar against the checksums Gradle publishes. A tampered
  # wrapper executes arbitrary code on every developer machine and every CI run, and it
  # is the single cheapest supply-chain check available to a Gradle project.
  wrapper:
    name: Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    needs: wrapper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: ./gradlew --no-daemon :vault:test :app:testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug

      # Reports are worth more on failure than on success, hence always().
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            vault/build/reports/tests/
            app/build/reports/tests/
            vault/build/test-results/
            app/build/test-results/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    needs: wrapper
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      # Only Lint errors reach the Security tab. Warnings are worth reading and worth
      # fixing, but publishing them as security alerts puts "a newer version of
      # camera-view is available" in the same list, with the same weight, as a hardcoded
      # secret. That does not make anyone safer, it makes the list unreadable. The full
      # report stays available as an artifact below.
      #
      # Lint's SARIF puts the severity on the rule rather than on each result, so the
      # filter has to resolve ruleIndex back to the rule before deciding.
      - name: Keep only Lint errors for the Security tab
        if: always()
        run: |
          jq '
            .runs |= map(
              . as $run
              | .results |= map(
                  select(
                    (($run.tool.driver.rules[.ruleIndex].defaultConfiguration.level) // "warning")
                    == "error"
                  )
                )
            )
          ' app/build/reports/lint-results-debug.sarif > lint-errors.sarif
          echo "errors published: $(jq '[.runs[].results[]] | length' lint-errors.sarif)"

      - name: Upload Lint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: lint-errors.sarif
          category: android-lint
        continue-on-error: true

      # Everything the filter above dropped lives here, so a warning is one click away
      # rather than gone.
      - name: Upload the full Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.sarif
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    needs: wrapper
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: matrix.language == 'java-kotlin'

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is broader than the default suite and worth the extra
          # minutes on a codebase that signs assertions for other people's accounts.
          queries: security-and-quality
          # Four queries are filtered out there, each with the evidence for why it does
          # not apply to this codebase and what excluding it costs.
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}

      # Manual rather than autobuild: autobuild guesses at an Android project and often
      # analyses a fraction of the sources, which passes while seeing almost nothing.
      - name: Build for analysis
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --no-daemon :vault:compileKotlin :app:compileDebugKotlin

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    needs: wrapper
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Resolves the actual dependency graph rather than parsing build files, so
      # transitive versions are the ones really on the classpath. BouncyCastle and OkHttp
      # both sit on the path a vault file travels, so this is not box-ticking.
      - name: Write the resolved dependency list
        run: |
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > deps-app.txt || true
          ./gradlew --no-daemon -q :vault:dependencies --configuration runtimeClasspath > deps-vault.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: deps-*.txt
          retention-days: 14

      # Gradle has no lockfile in this project, so one is generated on the fly. Writing
      # verification metadata enumerates every module that actually resolves, versions
      # included, which is exactly what a vulnerability scanner needs and what parsing
      # build.gradle by hand would get wrong for transitive dependencies.
      - name: Generate a dependency lockfile for scanning
        run: |
          ./gradlew --no-daemon --write-verification-metadata sha256 :app:dependencies :vault:dependencies || true
          ls -l gradle/verification-metadata.xml || echo "no metadata produced"

      - name: OSV-Scanner
        if: hashFiles('gradle/verification-metadata.xml') != ''
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=gradle/verification-metadata.xml
        continue-on-error: true

  # Reports what a pull request adds to the dependency graph, including licences.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks reads history, and a secret committed then removed is still leaked.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan the repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    needs: wrapper
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Everything below is skipped rather than failed when the token is missing, so a
      # fork's pull request is not red for a secret it was never going to have.
      - name: Check for a Snyk token
        id: token
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SNYK_TOKEN is not set, skipping the Snyk jobs"
          fi

      - uses: actions/setup-java@v4
        if: steps.token.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.token.outputs.present == 'true'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.token.outputs.present == 'true'

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        if: steps.token.outputs.present == 'true'

      # --configuration-matching is what keeps this honest. Without it Snyk resolves
      # every Gradle configuration, including AGP's _internal-unified-test-platform-*,
      # which drags in a whole gRPC, netty, protobuf and logback stack. None of it is on
      # any compile or runtime classpath, none of it reaches the APK, and it produced
      # roughly 160 advisories about code this project never executes. Restricting the
      # scan to the runtime classpaths reports what actually ships.
      - name: Snyk Open Source
        if: steps.token.outputs.present == 'true'
        run: |
          snyk test --all-sub-projects --severity-threshold=medium \
            --configuration-matching='^(releaseRuntimeClasspath|runtimeClasspath)$' \
            --sarif-file-output=snyk-oss.sarif || true

      - name: Snyk Code
        if: steps.token.outputs.present == 'true'
        run: snyk code test --sarif-file-output=snyk-code.sarif || true

      - name: Upload Snyk Open Source SARIF
        if: steps.token.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss
        continue-on-error: true

      - name: Upload Snyk Code SARIF
        if: steps.token.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
        continue-on-error: true
